<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Motaz Adham — portfolio launching soon.">
    <title>Motaz Adham</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101828;
        color: #f8fafc;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(circle at 20% 10%, #1d4ed866, transparent 34rem),
          radial-gradient(circle at 80% 85%, #0f766e55, transparent 30rem),
          #101828;
      }

      main { max-width: 40rem; text-align: center; }
      p { color: #cbd5e1; font-size: 1.1rem; line-height: 1.6; }
      .eyebrow { color: #5eead4; font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: .45rem 0 1rem; font-size: clamp(2.75rem, 10vw, 5rem); letter-spacing: -.06em; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Portfolio · coming soon</div>
      <h1>Motaz Adham</h1>
      <p>I’m building a portfolio of practical, secure web projects. Check back soon.</p>
    </main>
  </body>
</html>
